name: deploy

# Publication GitHub Pages du site statique Suture (branche main uniquement).
# Hors PR : le budget CI de 5 minutes ne s'applique qu'aux pull requests.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: build-and-deploy
    runs-on: [self-hosted, linux, x64, suture-worker]
    timeout-minutes: 10 # hors PR : installation + build + publication (justifié)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: false

      - name: Outillage Node (r630 ou poste de travail)
        shell: bash
        run: |
          # Node 24 sur le r630 (~/node24/bin), Node du poste (~/.local/bin).
          for d in "$HOME/node24/bin" "$HOME/.local/bin"; do
            [ -d "$d" ] && echo "$d" >> "$GITHUB_PATH"
          done
          node --version
          pnpm --version

      - name: Dépendances + build
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install
          fi
          pnpm build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
