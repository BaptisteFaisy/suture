name: recette

# Recette complète du projet (docs/RECETTE.md, section B.18 du cahier) :
# suite de tests entière, construction, gardes de dépôt et contrôle automatisé
# de conformité au concours. Ce workflow ne tourne JAMAIS sur une pull request :
# il est déclenché à la main et chaque nuit, sur les workers r630 du dépôt
# (label suture-worker), ce qui les laisse disponibles pour les checks de PR.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

concurrency:
  group: recette
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recette:
    name: recette
    runs-on: [self-hosted, linux, x64, suture-worker]
    timeout-minutes: 20 # hors PR : suite complète + construction + conformité (justifié)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: false

      - name: Outillage (Node du r630, gh du poste)
        shell: bash
        run: |
          for d in "$HOME/node24/bin" "$HOME/bin" "$HOME/.local/bin"; do
            [ -d "$d" ] && echo "$d" >> "$GITHUB_PATH"
          done
          node --version
          pnpm --version

      - name: Nettoyage du workspace
        shell: bash
        run: git clean -ffdx -e node_modules

      - name: Dépendances
        shell: bash
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Types, lint, tests (unitaires + propriétés), construction
        shell: bash
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test:run
          pnpm build

      - name: Gardes de dépôt (vocabulaire, taille des fichiers)
        shell: bash
        run: pnpm guards

      - name: Contrôle de conformité au concours
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_PAT }}
        shell: bash
        run: node scripts/check-contest.mjs
